
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Object Updater</title>
</head>
<body>
    <h2>Edit User Details</h2>

    <form id="userForm">
        <label>Name:</label>
        <input type="text" id="name" value="John" required><br><br>

        <label>Email:</label>
        <input type="email" id="email" value="john@mail.com" required><br><br>

        <label>Age:</label>
        <input type="number" id="age" value="21" min="1" required><br><br>

        <button type="submit">Update User</button>
    </form>

    <h3>Updated User Object</h3>
    <pre id="output"></pre>

    <script src="q8-object-updater.js"></script>
</body>
</html>
