<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Different CSS filters applied to images</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=1"
                     alt="Nature image"
                     class="blur">
                <figcaption>Blur</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=2"
                     alt="Mountain image"
                     class="grayscale">
                <figcaption>Grayscale</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=3"
                     alt="Forest image"
                     class="sepia">
                <figcaption>Sepia</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=4"
                     alt="Beach image"
                     class="brightness">
                <figcaption>Brightness</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=5"
                     alt="City image"
                     class="contrast">
                <figcaption>Contrast</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=6"
                     alt="Lake image"
                     class="hue">
                <figcaption>Hue Rotate</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>Responsive CSS Practice</p>
    </footer>

</body>
</html>
