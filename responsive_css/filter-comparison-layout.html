<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

    <header>
        <h1>Filter Comparison</h1>
        <p>Before and After CSS Filter</p>
    </header>

    <main>
        <section class="comparison">

            <figure>
                <img src="https://picsum.photos/500/350?random=20"
                     alt="Original image">
                <figcaption>Before - Original</figcaption>
            </figure>

            <figure>
                <img class="filtered"
                     src="https://picsum.photos/500/350?random=20"
                     alt="Filtered image">
                <figcaption>After - Filtered</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Filter Comparison</p>
    </footer>

</body>
</html>
