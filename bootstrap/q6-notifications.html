<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q6-notifications.css">
</head>
<body class="bg-light">

<header class="bg-dark text-white py-3 mb-4">
  <div class="container">
    <h1 class="fw-bold mb-0">Dashboard</h1>
  </div>
</header>

<main class="container pb-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-4">Notifications</h4>

      <!-- Success alert -->
      <div class="alert alert-success" role="alert">
        <strong>New message:</strong> Priya sent you a project update.
      </div>

      <!-- Info alert -->
      <div class="alert alert-info" role="alert">
        <strong>Tip:</strong> You can pin important notifications for quick access.
      </div>

      <!-- Dismissible danger alert -->
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Warning:</strong> Your storage quota is at 90%.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <!-- Summary well -->
      <div class="bg-light border rounded p-4 mt-4">
        <h5 class="fw-bold">Summary</h5>
        <p class="mb-0 text-muted">You have 1 unread message, 1 tip, and 1 warning that needs attention today.</p>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
