<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q7-tasks.css">
</head>
<body class="bg-light">

<header class="bg-dark text-white py-3 mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="fw-bold mb-0">My Tasks</h1>
    <!-- Badge counter for total pending tasks -->
    <span class="badge bg-warning text-dark fs-6">4 Pending</span>
  </div>
</header>

<main class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8">

      <ul class="list-group shadow-sm">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Finish DSA assignment
          <span class="badge bg-danger rounded-pill">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Review cloud lab notes
          <span class="badge bg-warning text-dark rounded-pill">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Update portfolio site
          <span class="badge bg-success rounded-pill">Low</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Prepare ML project demo
          <span class="badge bg-danger rounded-pill">High</span>
        </li>
      </ul>

      <div class="text-center mt-4">
        <!-- Completed button with embedded badge -->
        <button class="btn btn-outline-success">
          Completed <span class="badge bg-success ms-1">6</span>
        </button>
      </div>

    </div>
  </div>
</main>

</body>
</html>
