<!-- Question 1: Embedding a YouTube video using iframe -->
<!-- width and height are given in % so it resizes with the browser -->
<html>
<head>
    <title>My YouTube Video</title>
</head>
<body>
    <h1>My Favorite YouTube Video</h1>

    <!-- using % values instead of px so it adjusts on resize -->
    <iframe width="80%" height="60%" src="https://www.youtube.com/embed/nkjEQ5QORuE">
    </iframe>

</body>
</html>
