<!DOCTYPE html>
<html>
<head>
    <title>URI Encoding</title>
</head>

<body>

    <h1>URI Encoding Example</h1>

    <p>The URL contains special characters and spaces.</p>

    <!-- Space is encoded as %20 -->
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search HTML &amp; CSS
    </a>

</body>
</html>
