<!DOCTYPE html>
<html>
<head>
    <title>Form Page</title>
</head>

<body>

    <h1>Simple Form</h1>

    <!-- Result will open inside the iframe -->
    <form action="result.html" target="resultFrame">

        Enter your name:
        <input type="text" name="name">
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <iframe name="resultFrame" width="100%" height="150"></iframe>

</body>
</html>
