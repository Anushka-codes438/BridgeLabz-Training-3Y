<!DOCTYPE html>
<html>
<head>
    <title>Student Information Form</title>
</head>

<body>

    <h1>Student Information</h1>

    <form>

        Name:
        <input type="text" required>
        <br><br>

        Roll Number:
        <input type="text" required>
        <br><br>

        Course:
        <select required>

            <option disabled selected>Select Course</option>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>BBA</option>

        </select>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
