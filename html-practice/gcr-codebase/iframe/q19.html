<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>

<body>

    <h1>Secure Form</h1>

    <form autocomplete="off">

        Name:
        <input type="text" required>
        <br><br>

        Email:
        <input type="email" required>
        <br><br>

        Password:
        <input type="password" required>
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <p>
        Turning off autocomplete can improve security because the browser
        will not automatically show or fill previously saved information.
    </p>

</body>
</html>
