<!DOCTYPE html>
<html>
<head>
    <title>File Upload Form</title>
</head>

<body>

    <h1>Upload a File</h1>

    <form>

        <input type="file" accept=".jpg,.png">
        <br><br>

        <input type="submit" value="Upload">

    </form>

    <p>Only JPG and PNG image files are allowed.</p>

</body>
</html>
