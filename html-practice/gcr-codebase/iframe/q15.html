<!DOCTYPE html>
<html>
<head>
    <title>Payment Form</title>
</head>

<body>

    <h1>Payment Form</h1>

    <form>

        Cardholder Name:
        <input type="text" required>
        <br><br>

        Card Number:
        <input type="text" required>
        <br><br>

        Expiry Date:
        <input type="month" required>
        <br><br>

        CVV:
        <input type="password" required>
        <br><br>

        <input type="submit" value="Pay Now">

    </form>

</body>
</html>
