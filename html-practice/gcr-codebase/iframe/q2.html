<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>

<body>

    <h1>My City Map</h1>

    <!-- Loading lazy means the map will load when needed -->
    <iframe
        src="https://www.google.com/maps?q=Aligarh,India&output=embed"
        width="100%"
        height="500"
        title="Aligarh Map"
        loading="lazy">
    </iframe>

</body>
</html>
