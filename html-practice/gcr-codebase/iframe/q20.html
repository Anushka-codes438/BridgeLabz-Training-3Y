<!DOCTYPE html>
<html>
<head>

    <!-- Title shows the name of the webpage in the browser tab -->
    <title>Important Head Elements</title>

    <!-- Charset defines the character encoding used by the webpage -->
    <meta charset="UTF-8">

    <!-- Description gives information about the webpage -->
    <meta name="description" content="A webpage showing important head elements">

    <!-- Author tells who created the webpage -->
    <meta name="author" content="Abhi">

    <!-- Base sets the main URL for relative links -->
    <base href="https://example.com/">

    <!-- Link can be used to connect a favicon or other external resource -->
    <link rel="icon" href="favicon.ico">

    <!-- Style tag is used for CSS -->
    <style>
    </style>

    <!-- Script tag is used for JavaScript -->
    <script>
    </script>

</head>

<body>

    <h1>Important Head Elements</h1>

    <p>This page contains different important elements used inside the head tag.</p>

</body>
</html>
