<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>

<body>

    <h1>Feedback Form</h1>

    <form method="post" action="#">

        <p>Write your feedback:</p>
        <textarea name="feedback" rows="5" cols="30"></textarea>

        <p>Rating:</p>

        <input type="radio" name="rating" value="Good"> Good
        <br>

        <input type="radio" name="rating" value="Average"> Average
        <br>

        <input type="radio" name="rating" value="Poor"> Poor
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
