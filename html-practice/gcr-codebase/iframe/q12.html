<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities</title>
</head>

<body>

    <p>
        Less than sign: &lt;
        <br>

        Greater than sign: &gt;
        <br>

        Ampersand: &amp;
        <br>

        Double quote: &quot;
        <br>

        Single quote: &apos;
        <br><br>

        Copyright: &copy;
        <br>

        Trademark: &trade;
        <br>

        Registered: &reg;
    </p>

</body>
</html>
