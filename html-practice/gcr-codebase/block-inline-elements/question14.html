<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Database</title>
</head>
<body>

    <h1>Movie Database</h1>

    <table border="1" title="Movie database table">

        <!-- Caption -->
        <caption>
            <strong>Popular Movies</strong>
        </caption>

        <tr>
            <th>Movie Name</th>
            <th>Genre</th>
            <th>Year</th>
            <th>IMDB Rating</th>
            <th>Link</th>
        </tr>

        <tr>
            <td>Inception</td>
            <td>Science Fiction</td>
            <td>2010</td>
            <td>8.8</td>
            <td>
                <a href="https://www.imdb.com/">IMDB</a>
            </td>
        </tr>

        <tr>
            <td>Interstellar</td>
            <td>Science Fiction</td>
            <td>2014</td>
            <td>8.7</td>
            <td>
                <a href="https://www.imdb.com/">IMDB</a>
            </td>
        </tr>

        <tr>
            <td>3 Idiots</td>
            <td>Comedy/Drama</td>
            <td>2009</td>
            <td>8.4</td>
            <td>
                <a href="https://www.imdb.com/">IMDB</a>
            </td>
        </tr>

        <!-- Colspan -->
        <tr>
            <td colspan="5">
                More movies will be added soon.
            </td>
        </tr>

    </table>

    <!-- Note -->
    <p>
        <small>
            Note: IMDB ratings may change over time.
        </small>
    </p>

</body>
</html>
