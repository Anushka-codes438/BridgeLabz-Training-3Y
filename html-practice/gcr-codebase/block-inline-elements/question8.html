<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>

    <h1>GLA University</h1>

    <h2>Student Report Card</h2>

    <table border="1" title="Student marks report">

        <tr>
            <th rowspan="2" title="Student information">Student</th>
            <th colspan="5" title="Marks obtained in five subjects">Subjects</th>
        </tr>

        <tr>
            <th>English</th>
            <th>Mathematics</th>
            <th>Computer Science</th>
            <th>Physics</th>
            <th>Chemistry</th>
        </tr>

        <tr>
            <td>Garima Singh</td>
            <td>85</td>
            <td>92</td>
            <td>95</td>
            <td>88</td>
            <td>90</td>
        </tr>

        <tr>
            <td colspan="4">Total Marks</td>
            <td colspan="2">450 / 500</td>
        </tr>

        <tr>
            <td colspan="4">Percentage</td>
            <td colspan="2">90%</td>
        </tr>

    </table>

</body>
</html>
